<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<meta name="robots" content="noindex, nofollow">
<title>JACARALL Team Hub</title>
<link rel="icon" href="../assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#0A0A0A; --panel:#141312; --card:#1B1917; --line:#2A2522; --line2:#3A322C;
  --ink:#F2EEEA; --soft:#9C948A; --mute:#6E675F;
  --brand:#8C1F3B; --brand-deep:#5C0E14; --brand-ink:#E7A3B5;
  --ochre:#C99A4A; --sage:#7B8567; --slate:#6A7B8C;
  --good:#5FA87D; --good-bg:#132018; --warn:#C99A4A; --warn-bg:#241C10; --bad:#E0567A; --bad-bg:#2A1016; --info:#7FA3C4; --info-bg:#121B24;
  --r:6px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);background-image:radial-gradient(circle at 1px 1px,rgba(242,238,234,.045) 1px,transparent 0);background-size:18px 18px;
  color:var(--ink);font-family:Inter,'IBM Plex Sans Arabic',system-ui,sans-serif;font-size:15px;min-height:100vh;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
html[dir=rtl] body{font-family:'IBM Plex Sans Arabic',Inter,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:'IBM Plex Mono',monospace}
.serif{font-family:Fraunces,serif}
.wrap{max-width:980px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 18px) 16px calc(env(safe-area-inset-bottom,0px) + 96px)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{height:46px;width:auto;display:block;margin-inline-start:-14px}
.top-actions{display:flex;gap:8px;align-items:center}
.pill{border:1px solid var(--line2);background:var(--panel);border-radius:40px;padding:7px 12px;font-size:12.5px;cursor:pointer;display:inline-flex;gap:7px;align-items:center;white-space:nowrap}
.pill:hover{border-color:var(--soft)}
.pill.static{cursor:default}.pill.static:hover{border-color:var(--line2)}
.pill.back{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.pill.back:hover{border-color:var(--ink);opacity:.9}
.avatar{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px;font-weight:600;background:var(--brand);color:#fff;flex:0 0 auto}
.avatar.lg{width:38px;height:38px;font-size:14px}
.kicker{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--soft)}
html[dir=rtl] .kicker{letter-spacing:0}

.hello{margin:22px 2px 4px;font-family:Fraunces,serif;font-weight:600;font-size:clamp(26px,5vw,38px);line-height:1.1}
html[dir=rtl] .hello{font-family:'IBM Plex Sans Arabic',sans-serif}
.hello em{font-style:italic;color:var(--brand-ink);font-weight:400}

/* clocks */
.clocks{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 6px}
.clock{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.clock .city{font-size:12.5px;color:var(--soft)}
.clock .time{font-family:'IBM Plex Mono',monospace;font-size:20px}
.clock .flag{font-size:18px}
.clock.mine{border-color:var(--brand)}

/* nav */
.nav{position:sticky;top:0;z-index:20;margin:14px -16px 0;padding:10px 16px;background:rgba(10,10,10,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav-in{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.nav-in::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid transparent;background:transparent;padding:9px 14px;border-radius:40px;cursor:pointer;color:var(--soft);font-size:13.5px;display:inline-flex;align-items:center;gap:7px}
.tab.on{background:var(--ink);color:var(--bg);font-weight:600}
.tab .n{font-family:'IBM Plex Mono',monospace;font-size:10.5px;background:var(--brand);color:#fff;border-radius:20px;padding:1px 7px}

h2{font-family:Fraunces,serif;font-weight:600;font-size:21px;margin:26px 2px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
html[dir=rtl] h2{font-family:'IBM Plex Sans Arabic',sans-serif}
h2 small{font-family:Inter,sans-serif;font-weight:400;font-size:12.5px;color:var(--soft)}

/* stat tiles */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer}
.stat:hover{border-color:var(--line2)}
.stat b{display:block;font-family:Fraunces,serif;font-size:30px;font-weight:600;line-height:1}
.stat span{font-size:12px;color:var(--soft);display:block;margin-top:6px}
.stat.alert b{color:var(--bad)}
.stat.hot b{color:var(--ochre)}
.stat.ok b{color:var(--good)}

.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}

/* task cards */
.tasks{display:flex;flex-direction:column;gap:8px}
.task{background:var(--panel);border:1px solid var(--line);border-inline-start:4px solid var(--line2);border-radius:var(--r);padding:12px 14px;cursor:pointer;transition:border-color .12s}
.task:hover{border-color:var(--line2)}
.task.p-urgent{border-inline-start-color:var(--bad)}
.task.p-high{border-inline-start-color:var(--ochre)}
.task.p-normal{border-inline-start-color:var(--slate)}
.task.p-low{border-inline-start-color:var(--sage)}
.task.s-done{opacity:.6}
.task.s-done .t-title{text-decoration:line-through;text-decoration-color:var(--mute)}
.t-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.t-title{font-weight:600;font-size:15px;line-height:1.35}
.t-meta{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;font-size:12px;color:var(--soft);align-items:center}
.t-meta .od{color:var(--bad)}
.t-meta .today{color:var(--ochre)}
.people{display:inline-flex}
.people .avatar{width:20px;height:20px;font-size:9px;border:2px solid var(--panel);margin-inline-start:-6px}
.people .avatar:first-child{margin-inline-start:0}

.tag{display:inline-flex;align-items:center;gap:5px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:3px 9px;border-radius:20px;white-space:nowrap;border:1px solid transparent}
html[dir=rtl] .tag{font-family:'IBM Plex Sans Arabic',sans-serif;font-size:11.5px}
.tag.todo{background:var(--card);color:var(--soft);border-color:var(--line2)}
.tag.doing{background:var(--info-bg);color:var(--info)}
.tag.blocked{background:var(--bad-bg);color:var(--bad)}
.tag.done{background:var(--good-bg);color:var(--good)}
.tag.partial{background:var(--warn-bg);color:var(--warn)}
.tag.office{background:transparent;border-color:var(--line2);color:var(--soft)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}

/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:40px;padding:3px}
.seg button{border:none;background:transparent;padding:6px 12px;border-radius:40px;font-size:12.5px;color:var(--soft);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
.search{flex:1;min-width:160px}

/* forms */
.inp,.sel,.txt{width:100%;background:var(--card);border:1px solid var(--line2);border-radius:5px;padding:10px 11px;font-size:15px;color:var(--ink)}
.txt{min-height:84px;resize:vertical}
.inp:focus,.sel:focus,.txt:focus{outline:1.5px solid var(--ink);outline-offset:0}
.lbl{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.7px;text-transform:uppercase;color:var(--soft);margin:14px 0 6px}
html[dir=rtl] .lbl{font-family:'IBM Plex Sans Arabic',sans-serif;font-size:12px;letter-spacing:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipsel{border:1px solid var(--line2);background:var(--card);border-radius:40px;padding:6px 11px 6px 6px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
html[dir=rtl] .chipsel{padding:6px 6px 6px 11px}
.chipsel.on{border-color:var(--brand-ink);background:rgba(140,31,59,.25)}

.btn{border:none;border-radius:5px;padding:11px 16px;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn:active{opacity:.8}
.btn.pri{background:var(--brand);color:#fff}
.btn.pri:hover{background:#A2264A}
.btn.wa{background:#1F8F4E;color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--ink)}
.btn.danger{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.btn.sm{padding:7px 11px;font-size:12.5px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.btns .btn{flex:1;min-width:120px}

.fab{position:fixed;inset-inline-end:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);z-index:30;border:none;background:var(--brand);color:#fff;border-radius:40px;padding:15px 20px;font-weight:600;font-size:14.5px;box-shadow:0 10px 30px rgba(0,0,0,.5);cursor:pointer;display:flex;gap:8px;align-items:center}

/* links */
.links{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lnk{display:block;text-decoration:none;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;position:relative;overflow:hidden}
.lnk:hover{border-color:var(--brand)}
.lnk .k{font-size:10px}
.lnk b{display:block;font-family:Fraunces,serif;font-weight:600;font-size:18px;margin-top:8px}
html[dir=rtl] .lnk b{font-family:'IBM Plex Sans Arabic',sans-serif}
.lnk p{margin:6px 0 0;font-size:12.5px;color:var(--soft)}
.lnk .arr{position:absolute;top:14px;inset-inline-end:14px;color:var(--brand-ink)}
html[dir=rtl] .lnk .arr{transform:scaleX(-1)}
.lnk::after{content:"";position:absolute;inset-inline-end:-30px;bottom:-30px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,rgba(140,31,59,.35),transparent 70%)}

/* news */
.news{border-inline-start:3px solid var(--brand);padding:4px 14px;margin:0 0 14px}
.news .when{font-size:11.5px;color:var(--soft)}
.news h4{margin:4px 0 4px;font-size:15.5px}
.news p{margin:0;color:#D8D2CB;white-space:pre-wrap;line-height:1.55;font-size:14px}
.news.pin{background:rgba(140,31,59,.12);border-radius:0 var(--r) var(--r) 0}
html[dir=rtl] .news.pin{border-radius:var(--r) 0 0 var(--r)}

/* team */
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.member{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;gap:12px;align-items:center}
.member .nm{font-weight:600}
.member .rl{font-size:12.5px;color:var(--soft)}
.member .ld{font-size:11.5px;color:var(--brand-ink);margin-top:3px;font-family:'IBM Plex Mono',monospace}
.member .acts{margin-inline-start:auto;display:flex;gap:4px}
.icon-btn{border:none;background:transparent;color:var(--soft);cursor:pointer;padding:6px;border-radius:4px;font-size:15px;line-height:1}
.icon-btn:hover{color:var(--ink);background:var(--card)}

/* workload */
.load{display:grid;grid-template-columns:auto 1fr auto;gap:8px 10px;align-items:center;font-size:13px}
.bar{height:8px;background:var(--card);border-radius:8px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}

.empty{border:1px dashed var(--line2);border-radius:var(--r);padding:26px 16px;text-align:center;color:var(--soft);font-size:13.5px}

/* gate */
.gate{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 40px) 16px 60px}
.gate .logo{height:70px;margin:0 auto 6px;margin-inline-start:auto}
.gate h1{font-family:Fraunces,serif;font-weight:600;font-size:30px;text-align:center;margin:14px 0 4px}
html[dir=rtl] .gate h1{font-family:'IBM Plex Sans Arabic',sans-serif}
.gate .sub{text-align:center;color:var(--soft);margin:0 0 26px;font-size:14px}
.who{display:flex;flex-direction:column;gap:6px}
.who button{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;cursor:pointer}
.who button:hover{border-color:var(--brand)}
.who .rl{font-size:12px;color:var(--soft)}
.who .lock{margin-inline-start:auto;font-size:12px;color:var(--soft)}
.who .lock.new{font-size:11px;color:var(--brand-ink);border:1px solid var(--brand);border-radius:20px;padding:3px 9px;white-space:nowrap}
.asbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;background:var(--ochre);color:#1A1408;border-radius:10px;padding:8px 8px 8px 14px;margin-bottom:14px;font-size:13.5px;font-weight:600}
html[dir=rtl] .asbar{padding:8px 14px 8px 8px}
.asbar .btn{background:#1A1408;color:#F2EEEA;white-space:nowrap;margin-inline-start:auto}
.asbar span{min-width:0;overflow-wrap:anywhere}
.hint{font-size:12.5px;color:var(--soft);margin-top:8px;line-height:1.5}
.grp{margin:18px 2px 8px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--panel);border:1px solid var(--line2);border-radius:14px 14px 0 0;width:100%;max-width:620px;max-height:92vh;overflow:auto;padding:18px 18px calc(env(safe-area-inset-bottom,0px) + 22px);animation:up .2s ease}
@media(min-width:720px){.scrim{align-items:center}.sheet{border-radius:14px}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px}
.sheet-h h3{margin:0;font-family:Fraunces,serif;font-weight:600;font-size:21px}
html[dir=rtl] .sheet-h h3{font-family:'IBM Plex Sans Arabic',sans-serif}
@keyframes up{from{transform:translateY(30px);opacity:0}}
@keyframes fade{from{opacity:0}}
.desc{white-space:pre-wrap;line-height:1.6;color:#DAD4CD;margin:12px 0 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:13.5px;margin-top:14px}
.kv dt{color:var(--soft)}
.kv dd{margin:0}
.statusbar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.statusbar button{border:1px solid var(--line2);background:var(--card);border-radius:5px;padding:9px 4px;font-size:12.5px;cursor:pointer;color:var(--soft)}
.statusbar button.on.todo{border-color:var(--soft);color:var(--ink)}
.statusbar button.on.doing{border-color:var(--info);color:var(--info);background:var(--info-bg)}
.statusbar button.on.blocked{border-color:var(--bad);color:var(--bad);background:var(--bad-bg)}
.statusbar button.on.done{border-color:var(--good);color:var(--good);background:var(--good-bg)}
.cmt{border-top:1px solid var(--line);padding:10px 0;font-size:14px}
.cmt .by{font-size:12px;color:var(--soft);display:flex;gap:6px;align-items:center}
.cmt p{margin:5px 0 0;white-space:pre-wrap;line-height:1.5}

.banner{background:var(--warn-bg);border:1px solid #4A3A1E;color:#E6C990;border-radius:var(--r);padding:10px 12px;font-size:12.5px;margin-top:14px;line-height:1.5}
.sync{white-space:nowrap;font-size:11px;color:var(--mute);display:inline-flex;align-items:center;gap:6px}
.sync .dot{color:var(--good)}
.sync.off .dot{color:var(--warn)}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:40px;font-size:13.5px;font-weight:500;z-index:80;animation:up .2s;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast.err{background:var(--bad);color:#fff}


/* daily */
.dhead,.dnav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:22px 0 14px;flex-wrap:wrap}
.dday{font-family:Fraunces,serif;font-size:24px;font-weight:600;margin-top:4px}
html[dir=rtl] .dday{font-family:'IBM Plex Sans Arabic',sans-serif}
.streak{display:flex;gap:6px}
.sk{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:var(--mute);font-family:'IBM Plex Mono',monospace}
.sk i{width:22px;height:22px;border-radius:50%;border:1.5px dashed var(--line2);display:block}
.sk.s-done i{background:var(--good);border:none}.sk.s-partial i{background:var(--warn);border:none}.sk.s-not i{background:var(--bad);border:none}
.sk.now i{border:1.5px solid var(--brand-ink);box-shadow:0 0 0 3px rgba(140,31,59,.25)}
.sk.off i{border-style:solid;border-color:var(--line);opacity:.4}
.dform{display:flex;flex-direction:column;gap:10px}
.dstep{display:flex;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.dnum{flex:0 0 28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-family:Fraunces,serif;font-weight:600;font-size:14px}
.dbody{flex:1;min-width:0}
.dlabel{font-weight:600;font-size:15px;margin:3px 0 10px;display:flex;gap:8px;align-items:baseline}
.dlabel span{font-weight:400;font-size:12px;color:var(--mute)}
.dlabel.sm{font-size:13px;margin:14px 0 8px;color:var(--warn)}
.txt.slim{min-height:0;font-size:15px;line-height:1.5}
.chipsel.solo{padding:7px 13px}
html[dir=rtl] .chipsel.solo{padding:7px 13px}
.chipsel.solo.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chipsel.warn.on{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.dstatus{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dstatus button{border:1.5px solid var(--line2);background:var(--card);border-radius:8px;padding:12px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--soft);font-size:12.5px}
.dstatus b{font-size:18px;line-height:1}
.dstatus .done.on{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.dstatus .partial.on{border-color:var(--warn);background:var(--warn-bg);color:var(--warn)}
.dstatus .not.on{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.dwhy{border-top:1px dashed var(--line2);margin-top:14px}
.dpull{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center;font-size:12px;color:var(--soft)}
.mini{border:1px dashed var(--line2);background:transparent;border-radius:30px;padding:5px 10px;font-size:12px;cursor:pointer;color:var(--soft);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini:hover{color:var(--ink);border-color:var(--soft)}
.btn.big{padding:15px 18px;font-size:15.5px}
.dsent{background:linear-gradient(160deg,rgba(95,168,125,.12),transparent 60%),var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
.dsent-top{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.dsent .rl{font-size:12.5px;color:var(--soft);margin-top:2px}
.big-check{width:42px;height:42px;border-radius:50%;background:var(--good);color:#0A0A0A;display:grid;place-items:center;font-size:20px;font-weight:700}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.dcard{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--line2);border-radius:8px;padding:14px}
.dsent .dcard{background:var(--card)}
.dcard.st-done{border-top-color:var(--good)}.dcard.st-partial{border-top-color:var(--warn)}.dcard.st-not{border-top-color:var(--bad)}
.dcard-h{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.dcard-h .nm{font-weight:600;font-size:14.5px}
.dcard-h .rl{font-size:11.5px;color:var(--soft);display:flex;align-items:center;gap:5px;margin-top:2px}
.ddot{width:7px;height:7px;border-radius:2px;display:inline-block}

    return Array.prototype.map.call(new Uint8Array(buf), function(b){ return b.toString(16).padStart(2,'0'); }).join(''); });
}

var db = { tasks:{}, team:{}, news:{}, meta:{}, daily:{}, auth:{}, files:{} };
var online = !!DB_URL, lastSync = 0;
function base(){ return DB_URL.replace(/\/+$/,'') + '/' + ROOT; }
function loadLocal(){ try{ var raw = lsGet('jh_db'); if(raw){ var d = JSON.parse(raw); db.tasks = d.tasks||{}; db.team = d.team||{}; db.news = d.news||{}; db.meta = d.meta||{}; db.daily = d.daily||{}; db.auth = d.auth||{}; db.files = d.files||{}; } }catch(e){} }
function saveLocal(){ lsSet('jh_db', JSON.stringify(db)); }
var KEYS = ['tasks','team','news','meta','daily','auth','files'];
function pull(){
  if(!online){ loadLocal(); seed(); return Promise.resolve(); }
  return Promise.all(KEYS.map(function(k){ return fetch(base() + '/' + k + '.json', {cache:'no-store'}).then(function(r){ if(!r.ok) throw 0; return r.json(); }); })).then(function(vals){
    KEYS.forEach(function(k, i){ db[k] = vals[i] || {}; }); lastSync = Date.now(); saveLocal(); seed();
  }).catch(function(){ loadLocal(); });
}
function write(path, val){
  var parts = path.split('/'), obj = db; for(var i=0;i<parts.length-1;i++){ obj[parts[i]] = obj[parts[i]] || {}; obj = obj[parts[i]]; }
  if(val == null) delete obj[parts[parts.length-1]]; else obj[parts[parts.length-1]] = val;
  saveLocal();
  if(!online) return Promise.resolve();
  return fetch(base() + '/' + path + '.json', {method: val == null ? 'DELETE' : 'PUT', body: val == null ? undefined : JSON.stringify(val)})
    .then(function(r){ if(!r.ok) throw 0; lastSync = Date.now(); }).catch(function(){ toast('Sync failed — check connection', true); });
}
function seed(){
  if((db.meta && db.meta.seedV || 0) >= SEED_VERSION) return;
  SEED_TEAM.forEach(function(m){ var old = db.team[m.id] || {};
    write('team/' + m.id, {id:m.id, name:m.name, role:m.role, office:m.office, dept:deptOf(m), phone:old.phone || ''}); });
  var sv = db.team.eman || {}; if(sv.id) write('team/eman', Object.assign({}, sv, {role:'CEO', office:'BOTH'}));
  write('meta', {seedV:SEED_VERSION});
}

    var da = a.due || '9999', dbb = b.due || '9999'; if(da !== dbb) return da < dbb ? -1 : 1;

function supOf(id){ return SUPERVISORS.filter(function(x){ return x.id === id; })[0] || null; }

    if(own) return own === hs[0];
    return !!sup && sup.pin === hs[1];
  });
}

/* ---------- files ---------- */
var MAX_FILE = 25 * 1024 * 1024, CHUNK = 2 * 1024 * 1024, memBlobs = {};
var fFilt = { kind:'all', q:'' };
function putRaw(path, val){
  if(!online){ memBlobs[path] = val; return Promise.resolve(); }
  return fetch(base() + '/' + path + '.json', {method: val == null ? 'DELETE' : 'PUT', body: val == null ? undefined : JSON.stringify(val)}).then(function(r){ if(!r.ok) throw new Error('upload'); });
}
function getRaw(path){
  if(!online) return Promise.resolve(memBlobs[path] || null);
  return fetch(base() + '/' + path + '.json', {cache:'no-store'}).then(function(r){ if(!r.ok) throw new Error('download'); return r.json(); });
}
function kindOf(name, type){
  var e = (name.split('.').pop() || '').toLowerCase();
  if(/^image\//.test(type || '') || /^(jpe?g|png|gif|webp|heic|heif|bmp)$/.test(e)) return 'img';
  if(e === 'pdf' || type === 'application/pdf') return 'pdf';
  if(/^(xlsx?|csv|xlsm|numbers)$/.test(e)) return 'xls';
  if(/^(docx?|rtf|pages|txt)$/.test(e)) return 'doc';
  if(/^(pptx?|key)$/.test(e)) return 'ppt';
  if(/^(dwg|dxf|skp|max|3ds|rvt)$/.test(e)) return 'cad';
  return 'other';
}
var KINDS = { pdf:['PDF','#E0567A'], xls:['Excel','#3FAE6A'], doc:['Word','#5B8DEF'], img:['Images','#C99A4A'], ppt:['PowerPoint','#E07A3E'], cad:['CAD','#8E7CC3'], other:['Other','#7A736B'] };
function fmtSize(n){ return n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB'; }
function fileBadge(f){ var k = KINDS[f.kind] || KINDS.other; var ext = (f.name.split('.').pop() || '').slice(0, 4).toUpperCase();
  if(f.thumb) return h('div', {class:'fthumb', style:'background-image:url(' + f.thumb + ')'});
  return h('div', {class:'fbadge', style:'--k:' + k[1]}, ext || '•'); }
function readAsDataURL(blob){ return new Promise(function(res, rej){ var r = new FileReader(); r.onload = function(){ res(r.result); }; r.onerror = rej; r.readAsDataURL(blob); }); }
function loadImg(url){ return new Promise(function(res, rej){ var i = new Image(); i.onload = function(){ res(i); }; i.onerror = rej; i.src = url; }); }
function resizeImg(img, max, q){
  var w = img.naturalWidth, hh = img.naturalHeight, sc = Math.min(1, max / Math.max(w, hh));
  var c = document.createElement('canvas'); c.width = Math.round(w * sc); c.height = Math.round(hh * sc);
  var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', q);
}
function prepFile(file){
  var kind = kindOf(file.name, file.type);
  return readAsDataURL(file).then(function(url){
    if(kind !== 'img' || /gif$/i.test(file.type)) return {url:url, name:file.name, type:file.type || 'application/octet-stream', size:file.size, kind:kind, thumb:''};
    return loadImg(url).then(function(img){
      var big = file.size > 1.5 * 1024 * 1024 || Math.max(img.naturalWidth, img.naturalHeight) > 2400;
      var out = big ? resizeImg(img, 2400, 0.85) : url;
      var name = big ? file.name.replace(/\.[^.]+$/, '') + '.jpg' : file.name;
      return {url:out, name:name, type: big ? 'image/jpeg' : file.type, size: Math.round((out.length - out.indexOf(',') - 1) * 0.75), kind:'img', thumb: resizeImg(img, 220, 0.7)};
    }).catch(function(){ return {url:url, name:file.name, type:file.type, size:file.size, kind:kind, thumb:''}; });
  });
}
function uploadOne(p, meta, onProg){
  var id = uid(), b64 = p.url.slice(p.url.indexOf(',') + 1), n = Math.ceil(b64.length / CHUNK) || 1, i = 0;
  function next(){
    if(i >= n) return Promise.resolve();
    return putRaw('blobs/' + id + '/' + i, b64.slice(i * CHUNK, (i + 1) * CHUNK)).then(function(){ i++; onProg(i / n); return next(); });
  }
  return next().then(function(){
    return write('files/' + id, {id:id, name:p.name, type:p.type, size:p.size, kind:p.kind, thumb:p.thumb, chunks:n, by:me.id, at:Date.now(), project:meta.project || '', note:meta.note || ''});
  });
}
function pickFiles(list){
  list = Array.prototype.slice.call(list || []);
  var tooBig = list.filter(function(f){ return f.size > MAX_FILE; });
  if(tooBig.length) toast(t('fTooBig').replace('{n}', tooBig[0].name), true);
  list = list.filter(function(f){ return f.size <= MAX_FILE; });
  if(!list.length) return;
  var projects = {}; allTasks().forEach(function(x){ if(x.project) projects[x.project] = 1; }); allFiles().forEach(function(x){ if(x.project) projects[x.project] = 1; });
  ['Tulip Tower','Solamanya'].forEach(function(p){ projects[p] = 1; });
  var proj = h('input', {class:'inp', list:'fproj', placeholder:t('dProjPh')});
  var note = h('input', {class:'inp', placeholder:t('fNotePh')});
  var rows = list.map(function(f){ var bar = h('i'); return {f:f, bar:bar, el:h('div', {class:'frow up'}, fileBadge({name:f.name, kind:kindOf(f.name, f.type)}),
    h('div', {class:'fmeta'}, h('div', {class:'fname'}, f.name), h('div', {class:'prog'}, bar)), h('span', {class:'fsz'}, fmtSize(f.size)))}; });
  var go = h('button', {class:'btn pri', onclick:start}, '↑ ' + t('fUpload') + (list.length > 1 ? ' (' + list.length + ')' : ''));
  var cancel = h('button', {class:'btn ghost', onclick:function(){ sh.close(); }}, t('cancel'));
  var sh = sheet(t('fUploadTitle'), [h('div', {class:'flist'}, rows.map(function(r){ return r.el; })),
    h('label', {class:'lbl'}, t('project') + ' · ' + t('optional')), proj, h('datalist', {id:'fproj'}, Object.keys(projects).map(function(p){ return h('option', {value:p}); })),
    h('label', {class:'lbl'}, t('fNote') + ' · ' + t('optional')), note, h('div', {class:'btns'}, cancel, go)]);
  var busy = false;
  function start(){
    if(busy) return; busy = true; go.disabled = true; cancel.disabled = true; go.textContent = t('fUploading');
    var meta = {project:proj.value.trim(), note:note.value.trim()}, k = 0, failed = 0;
    (function nextFile(){
      if(k >= rows.length){ sh.close(); toast(failed ? t('fFailed') : t('fDone'), !!failed); render(); return; }
      var r = rows[k++];
      prepFile(r.f).then(function(p){ return uploadOne(p, meta, function(x){ r.bar.style.width = Math.round(x * 100) + '%'; }); })
        .then(function(){ r.el.classList.add('ok'); }, function(){ failed++; r.el.classList.add('bad'); }).then(nextFile);
    })();
  }
}
function allFiles(){ return Object.keys(db.files || {}).map(function(k){ return db.files[k]; }).filter(Boolean).sort(function(a,b){ return b.at - a.at; }); }

function filesView(body){
  var input = h('input', {type:'file', multiple:true, style:'display:none', accept:'.pdf,.doc,.docx,.xls,.xlsx,.csv,.ppt,.pptx,.txt,.dwg,.dxf,.skp,image/*,application/pdf'});

    return h('button', {class: fFilt.kind === o[0] ? 'on' : '', onclick:function(){ fFilt.kind = o[0]; render(); }}, o[1], o[0] !== 'all' ? h('span', {class:'cnt'}, counts[o[0]]) : null); })));

    holder.appendChild(h('div', {class:'flist'}, list.map(function(f){ var m = member(f.by);
      return h('button', {class:'frow', onclick:function(){ fileDetail(f); }}, fileBadge(f),
        h('div', {class:'fmeta'}, h('div', {class:'fname'}, f.name),
          h('div', {class:'fsub'}, f.project ? h('span', {class:'fp'}, '▣ ' + f.project) : null, (m ? m.name.split(' ')[0] : '') + ' · ' + fmtWhen(f.at)),
          f.note ? h('div', {class:'fnote'}, f.note) : null),

function fileDetail(f){
  var m = member(f.by), canDel = me.sup || f.by === me.id;
  var status = h('div', {class:'hint'}, t('fPreparing'));
  var open = h('a', {class:'btn pri', style:'pointer-events:none;opacity:.5', target:'_blank', rel:'noopener'}, '↓ ' + t('fOpen'));
  var share = h('button', {class:'btn ghost', style:'display:none'}, t('fShare'));
  var preview = h('div', {class:'fprev'}, f.thumb ? h('img', {src:f.thumb, alt:''}) : fileBadge(f));
  var sh = sheet(f.name, [preview,
    h('dl', {class:'kv'}, h('dt', null, t('fBy')), h('dd', null, (m ? m.name : '—') + ' · ' + fmtWhen(f.at)), h('dt', null, t('fSize')), h('dd', null, fmtSize(f.size) + ' · ' + (KINDS[f.kind] || KINDS.other)[0]),
      f.project ? [h('dt', null, t('project')), h('dd', null, f.project)] : null, f.note ? [h('dt', null, t('fNote')), h('dd', null, f.note)] : null),
    status, h('div', {class:'btns'}, open, share), canDel ? h('div', {class:'btns'}, delBtn(function(){
      var jobs = []; for(var i=0;i<(f.chunks||1);i++) jobs.push(putRaw('blobs/' + f.id + '/' + i, null));
      Promise.all(jobs).catch(function(){}); write('files/' + f.id, null); sh.close(); toast(t('deleted')); render(); })) : null]);
  var parts = [], i = 0;
  (function next(){
    if(i >= (f.chunks || 1)) return done();
    getRaw('blobs/' + f.id + '/' + i).then(function(c){ if(c == null) throw 0; parts.push(c); i++; status.textContent = t('fPreparing') + ' ' + Math.round(i / (f.chunks||1) * 100) + '%'; next(); })
      .catch(function(){ status.textContent = t('fMissing'); });
  })();

      var blob = new Blob([arr], {type:f.type || 'application/octet-stream'}), url = URL.createObjectURL(blob);
      open.href = url; open.style.pointerEvents = ''; open.style.opacity = '';
      if(!/^(image\/|application\/pdf)/.test(f.type || '')) open.setAttribute('download', f.name);
      status.textContent = t('fReady');
      if(f.kind === 'img'){ preview.innerHTML = ''; preview.appendChild(h('img', {src:url, alt:f.name})); }
      var file = null; try{ file = new File([blob], f.name, {type:blob.type}); }catch(e){}
      if(file && navigator.canShare && navigator.canShare({files:[file]})){ share.style.display = ''; share.onclick = function(){ navigator.share({files:[file], title:f.name}).catch(function(){}); }; }
    }catch(e){ status.textContent = t('fMissing'); }
  }
}

/* ---------- sheet ---------- */
function sheet(title, content){
  var scrim = h('div', {class:'scrim'});
  var s = h('div', {class:'sheet', role:'dialog'}, h('div', {class:'sheet-h'}, h('h3', null, title), h('button', {class:'icon-btn', onclick:close, 'aria-label':'Close'}, '✕')), content);
  scrim.appendChild(s);
  scrim.addEventListener('click', function(e){ if(e.target === scrim) close(); });
  function esc(e){ if(e.key === 'Escape') close(); }
  document.addEventListener('keydown', esc);
  document.body.appendChild(scrim); document.body.style.overflow = 'hidden';
  function close(){ scrim.remove(); document.removeEventListener('keydown', esc); if(!document.querySelector('.scrim')) document.body.style.overflow = ''; }
  return {close:close};
}
