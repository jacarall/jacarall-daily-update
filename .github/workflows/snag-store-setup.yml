name: Snag store setup
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Create and test shared store
        run: |
          O=out.txt; H=h.txt
          {
          curl -sS -D $H -o body.json -X POST https://jsonblob.com/api/jsonBlob -H 'Content-Type: application/json' -H 'Accept: application/json' -d '{"items":{},"custom":{},"updatedAt":0}' -w "POST %{http_code}\n"
          grep -iE '^(location|x-jsonblob)' $H
          LOC=$(grep -i '^location:' $H | tr -d '\r' | awk '{print $2}')
          echo "GET1 $(curl -sS "$LOC")"
          echo "PUT $(curl -sS -o /dev/null -w '%{http_code}' -X PUT "$LOC" -H 'Content-Type: application/json' -H 'Accept: application/json' -d '{"items":{"t":{"done":true}},"custom":{},"updatedAt":1}')"
          echo "GET2 $(curl -sS "$LOC")"
          echo "RESET $(curl -sS -o /dev/null -w '%{http_code}' -X PUT "$LOC" -H 'Content-Type: application/json' -d '{"items":{},"custom":{},"updatedAt":0}')"
          echo "PREFLIGHT:"; curl -sS -i -X OPTIONS "$LOC" -H 'Origin: https://jacarall.github.io' -H 'Access-Control-Request-Method: PUT' -H 'Access-Control-Request-Headers: content-type' | grep -iE '^HTTP|access-control'
          echo "CORS GET:"; curl -sS -i "$LOC" -H 'Origin: https://jacarall.github.io' | grep -iE '^HTTP|access-control'
          echo "BLOB=$LOC"
          } > $O 2>&1 || true
          cat $O
          echo "::notice title=probe::$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' $O)"
